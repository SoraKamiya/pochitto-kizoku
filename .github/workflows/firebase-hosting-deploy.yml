name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/touch-panel-order-system-gnuo14

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Firestore rules are managed manually via the Firebase console for now —
      # the service account needs the Firebase Rules Admin role to deploy them
      # from CI too; add `,firestore:rules` back to --only once that's granted.
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@13 deploy --only hosting --project pochitto-kizoku
